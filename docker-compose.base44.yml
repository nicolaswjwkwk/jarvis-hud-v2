services:
  web:
    image: python:3.12-slim
    working_dir: /app
    ports:
      - "3000:8000"
    volumes:
      - ./:/app:ro
    command: python3 -m http.server 8000 --bind 0.0.0.0
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
